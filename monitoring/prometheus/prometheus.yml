global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scraping itself (useful sanity check)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The SplitKesh API running on the host machine.
  # If you run the API inside Docker on the same compose network instead,
  # change this target to your service name + port (e.g. "api:5000").
  - job_name: splitkesh-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5000"]
    # If you set METRICS_TOKEN in the API .env, uncomment and set it:
    # authorization:
    #   type: Bearer
    #   credentials: "your_metrics_token"
