# Prometheus + Grafana monitoring stack for the SplitKesh API.
# Run from this folder with:  docker compose up -d
#
# Your API runs on the HOST (npm run dev on port 5000). Prometheus
# reaches it via host.docker.internal (works on Docker Desktop for
# Windows/Mac; the extra_hosts line makes it work on Linux too).

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: splitkesh-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: grafana/grafana:latest
    container_name: splitkesh-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"          # Grafana UI at http://localhost:3001
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
